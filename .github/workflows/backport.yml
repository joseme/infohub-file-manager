# Backport: un PR fusionado en la rama principal con la etiqueta backport-business
# se pasa con cherry-pick a release/business-1.x y se abre el PR correspondiente.
# Funciona también si la etiqueta se agrega después de fusionar. Si hay conflicto,
# o el cambio toca .github/workflows (GITHUB_TOKEN no puede subir workflows),
# deja un comentario en el PR original para hacerlo a mano.
name: Backport

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  TARGET: release/business-1.x

jobs:
  backport:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'backport-business')) ||
       (github.event.action == 'labeled' && github.event.label.name == 'backport-business'))
    runs-on: ubuntu-latest
    steps:
      # Solo se usa código ya fusionado en la rama principal, nunca el del PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Cherry-pick y PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="backport/pr-$PR-business"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "La rama $branch ya existe; nada que hacer."
            exit 0
          fi

          manual() {
            gh pr comment "$PR" --body "No se pudo pasar automáticamente a \`$TARGET\` ($1). Backport a mano:
          \`\`\`
          git switch -c $branch origin/$TARGET
          git cherry-pick -x -m 1 $SHA   # sin -m 1 si se fusionó con squash
          git push -u origin $branch
          gh pr create --base $TARGET
          \`\`\`"
            exit 1
          }

          git switch -c "$branch" "origin/$TARGET"
          # Merge commit: -m 1 toma los cambios del PR; squash/rebase: commit simple.
          parents=$(git rev-list --parents -n 1 "$SHA" | wc -w)
          mainline=""; [ "$parents" -gt 2 ] && mainline="-m 1"
          git cherry-pick -x $mainline "$SHA" || { git cherry-pick --abort; manual "conflicto"; }
          git push origin "$branch" || manual "no se pudo subir la rama; ¿toca .github/workflows?"

          url=$(gh pr create --base "$TARGET" --head "$branch" \
            --title "[business] $PR_TITLE" \
            --body "Backport de #$PR a \`$TARGET\`.")
          # Los eventos creados con GITHUB_TOKEN no disparan otros workflows.
          gh workflow run pruebas.yml --ref "$branch"
          gh pr comment "$PR" --body "Backport a \`$TARGET\`: $url"
