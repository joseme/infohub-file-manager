# Merge-forward: cada cambio en release/** (correcciones de Business) se pasa a la
# rama principal con un PR release → principal que se fusiona solo cuando las
# pruebas pasan. Si hay conflicto, el PR queda abierto: crear una rama desde la
# principal, fusionar ahí la de release, resolver y abrir un PR con esa rama.
name: Merge-forward

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR hacia la rama principal
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          SRC: ${{ github.ref_name }}
        run: |
          if git merge-base --is-ancestor "origin/$SRC" "origin/$BASE"; then
            echo "$BASE ya contiene $SRC; nada que pasar."
            exit 0
          fi

          pr=$(gh pr list --base "$BASE" --head "$SRC" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base "$BASE" --head "$SRC" \
              --title "Merge-forward: $SRC → $BASE" \
              --body "Pasa a \`$BASE\` las correcciones de \`$SRC\`. Se fusiona solo cuando las pruebas pasan."
            pr=$(gh pr list --base "$BASE" --head "$SRC" --state open --json number -q '.[0].number')
          fi

          # Los eventos creados con GITHUB_TOKEN no disparan otros workflows:
          # se lanzan las pruebas a mano sobre la cabeza del PR.
          gh workflow run pruebas.yml --ref "$SRC"
          gh pr merge "$pr" --auto --merge
