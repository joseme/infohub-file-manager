# Pruebas unitarias (pytest).
# tests/qa_folder_probe.py no corre aquí: necesita un InfoHub real.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Para lanzar las pruebas a mano sobre una rama.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest -q
