# Pruebas unitarias (pytest), una vez por edición.
# tests/qa_folder_probe.py no corre aquí: necesita un InfoHub real.
name: Pruebas

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  # Para lanzar las pruebas a mano sobre una rama.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [business, enterprise]
    env:
      INFOHUB_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      # Como la imagen Business: sin ee/ (la app debe funcionar igual).
      - run: rm -rf ee
        if: matrix.edition == 'business'
      - run: python -m pytest -q
